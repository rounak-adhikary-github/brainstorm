name: Refresh weather data

# Keeps weather-data.txt in the repo up to date so the static site can serve
# today's weather even when the public APIs are unavailable or rate-limited.

on:
  schedule:
    # 01:15 UTC = 06:45 IST — ready before the first visitors of the day
    - cron: '15 1 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/fetch-weather.mjs'
      - '.github/workflows/weather.yml'

permissions:
  contents: write

concurrency:
  group: weather-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch today's weather
        run: node scripts/fetch-weather.mjs

      - name: Commit weather-data.txt when it changed
        run: |
          git config user.name "weather-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-data.txt
          if git diff --staged --quiet; then
            echo "No weather change to commit today."
          else
            git commit -m "chore: refresh daily weather data"
            git push
            echo "Committed the refreshed weather snapshot."
          fi
